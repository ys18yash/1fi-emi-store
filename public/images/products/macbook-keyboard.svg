<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="mb_kb_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#mb_kb_bg)"/>
  
  <!-- MacBook Top-Down Keyboard Deck -->
  <g transform="translate(45, 80)">
    <rect width="310" height="220" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    
    <!-- Keyboard Well -->
    <rect x="25" y="20" width="260" height="100" rx="8" fill="#09090B"/>
    <!-- Key Rows Sim -->
    <rect x="35" y="28" width="240" height="12" rx="3" fill="#27272A"/>
    <rect x="35" y="44" width="240" height="12" rx="3" fill="#27272A"/>
    <rect x="35" y="60" width="240" height="12" rx="3" fill="#27272A"/>
    <rect x="35" y="76" width="240" height="12" rx="3" fill="#27272A"/>
    <rect x="35" y="92" width="240" height="14" rx="3" fill="#27272A"/>
    
    <!-- Touch ID Sensor -->
    <circle cx="265" cy="34" r="5" fill="#38BDF8"/>
    
    <!-- Force Touch Trackpad -->
    <rect x="100" y="135" width="110" height="70" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
  </g>
  
  <text x="200" y="360" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="3">MAGIC KEYBOARD</text>
  <text x="200" y="390" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">Force Touch &amp; Touch ID</text>
  <text x="200" y="415" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">Full-Height Function Row &amp; Backlit Scissor Keys</text>
</svg>
