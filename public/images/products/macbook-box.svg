<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="mb_box_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#mb_box_bg)"/>
  
  <text x="200" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#71717A" text-anchor="middle" letter-spacing="2">WHAT'S IN THE BOX</text>
  <text x="200" y="80" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#18181B" text-anchor="middle">MacBook Pro 14 (M4)</text>
  
  <!-- MacBook Silhouette -->
  <g transform="translate(60, 110)">
    <rect width="180" height="120" rx="10" fill="#E4E4E7" stroke="#A1A1AA" stroke-width="2"/>
    <rect x="10" y="10" width="160" height="100" rx="4" fill="#27272A"/>
    <text x="90" y="160" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#18181B" text-anchor="middle">14-inch MacBook Pro</text>
  </g>
  
  <!-- Power Adapter & MagSafe Cable -->
  <g transform="translate(260, 110)">
    <rect width="80" height="80" rx="16" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="2"/>
    <circle cx="40" cy="40" r="16" fill="#E4E4E7"/>
    <text x="40" y="110" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#18181B" text-anchor="middle">70W Adapter</text>
    <text x="40" y="125" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#71717A" text-anchor="middle">+ 2m MagSafe</text>
  </g>
  
  <g transform="translate(50, 390)">
    <rect width="300" height="90" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="45" r="16" fill="#087443" fill-opacity="0.1"/>
    <path d="M28 45 L33 50 L42 39" stroke="#087443" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="65" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Official Apple Manufacturer Warranty</text>
    <text x="65" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">1 Year Direct Apple India Coverage</text>
    <text x="65" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#087443">1Fi Mutual Fund Collateral Secured</text>
  </g>
</svg>
