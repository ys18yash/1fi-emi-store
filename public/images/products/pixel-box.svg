<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="p_box_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#p_box_bg)"/>
  
  <text x="200" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#64748B" text-anchor="middle" letter-spacing="2">WHAT'S IN THE BOX</text>
  <text x="200" y="80" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#0F172A" text-anchor="middle">Google Pixel 10 Pro</text>
  
  <!-- Obsidian & Porcelain Dual Lineup -->
  <g transform="translate(60, 110)">
    <rect width="120" height="230" rx="24" fill="#202124" stroke="#475569" stroke-width="2"/>
    <rect x="15" y="40" width="90" height="24" rx="12" fill="#0F172A"/>
    <text x="60" y="265" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Obsidian</text>
  </g>
  
  <g transform="translate(220, 110)">
    <rect width="120" height="230" rx="24" fill="#EAE7DF" stroke="#CBD5E1" stroke-width="2"/>
    <rect x="15" y="40" width="90" height="24" rx="12" fill="#D6D3CB"/>
    <text x="60" y="265" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Porcelain</text>
  </g>
  
  <g transform="translate(50, 400)">
    <rect width="300" height="85" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5"/>
    <text x="150" y="35" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A" text-anchor="middle">Includes Quick Switch Adapter &amp; Cable</text>
    <text x="150" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B" text-anchor="middle">1m Type-C to Type-C 3.2 Gen 2</text>
    <text x="150" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#087443" text-anchor="middle">0% EMI VIA 1Fi MUTUAL FUNDS</text>
  </g>
</svg>
