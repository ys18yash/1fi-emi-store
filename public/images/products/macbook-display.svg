<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="mb_d_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="xdr_screen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#mb_d_bg)"/>
  
  <!-- MacBook Display Lid -->
  <g transform="translate(40, 70)">
    <rect width="320" height="210" rx="14" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
    <rect x="8" y="8" width="304" height="194" rx="8" fill="#000000"/>
    <rect x="12" y="12" width="296" height="186" rx="6" fill="url(#xdr_screen)"/>
    <!-- Notch -->
    <rect x="145" y="8" width="30" height="12" rx="4" fill="#000000"/>
    <circle cx="160" cy="14" r="2.5" fill="#10B981"/>
    
    <!-- MacBook Base Wedge -->
    <path d="M-10 215 L330 215 L310 230 L10 230 Z" fill="#27272A" stroke="#3F3F46" stroke-width="1.5"/>
  </g>
  
  <text x="200" y="360" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="3">LIQUID RETINA XDR</text>
  <text x="200" y="390" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">1600 Nits Peak HDR Display</text>
  <text x="200" y="415" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#94A3B8" text-anchor="middle">120Hz ProMotion Adaptive Refresh Rate</text>
  <text x="200" y="450" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">1Fi MUTUAL FUND COLLATERAL PURCHASING</text>
</svg>
