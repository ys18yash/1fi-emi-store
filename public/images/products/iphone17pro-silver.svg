<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="bg_grad_silv" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="body_silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="screen_glow_silv" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="phone_shadow_silv" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#475569" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="400" height="550" rx="24" fill="url(#bg_grad_silv)"/>
  
  <g filter="url(#phone_shadow_silv)">
    <rect x="95" y="45" width="210" height="440" rx="42" fill="url(#body_silver)" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="101" y="51" width="198" height="428" rx="36" fill="#0F172A"/>
    <rect x="105" y="55" width="190" height="420" rx="32" fill="url(#screen_glow_silv)"/>
    
    <rect x="165" y="66" width="70" height="22" rx="11" fill="#000000"/>
    <circle cx="218" cy="77" r="4" fill="#1E293B"/>
    
    <circle cx="200" cy="240" r="70" fill="#E2E8F0" fill-opacity="0.3" filter="blur(20px)"/>
    <circle cx="160" cy="300" r="55" fill="#38BDF8" fill-opacity="0.3" filter="blur(25px)"/>
    
    <text x="200" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="3">1Fi LAMF BACKED</text>
    <text x="200" y="402" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">iPhone 17 Pro</text>
    <text x="200" y="422" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#94A3B8" text-anchor="middle">Natural Silver</text>
  </g>
</svg>
