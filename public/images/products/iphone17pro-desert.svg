<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="bg_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF9"/>
      <stop offset="100%" stop-color="#EFE8DE"/>
    </linearGradient>
    <linearGradient id="body_desert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBC5AD"/>
      <stop offset="50%" stop-color="#C5A98F"/>
      <stop offset="100%" stop-color="#9E8066"/>
    </linearGradient>
    <linearGradient id="screen_glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E1B18"/>
      <stop offset="100%" stop-color="#0A0908"/>
    </linearGradient>
    <filter id="phone_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#7A6046" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="400" height="550" rx="24" fill="url(#bg_grad)"/>
  
  <!-- Phone Body -->
  <g filter="url(#phone_shadow)">
    <!-- Outer Titanium Rim -->
    <rect x="95" y="45" width="210" height="440" rx="42" fill="url(#body_desert)" stroke="#E8D8C8" stroke-width="2"/>
    <!-- Screen Bezel -->
    <rect x="101" y="51" width="198" height="428" rx="36" fill="#121110"/>
    <!-- Inner OLED Screen -->
    <rect x="105" y="55" width="190" height="420" rx="32" fill="url(#screen_glow)"/>
    
    <!-- Dynamic Island -->
    <rect x="165" y="66" width="70" height="22" rx="11" fill="#000000"/>
    <circle cx="218" cy="77" r="4" fill="#0F172A"/>
    
    <!-- Display Wallpaper Artwork -->
    <circle cx="200" cy="240" r="70" fill="#C5A98F" fill-opacity="0.3" filter="blur(20px)"/>
    <circle cx="160" cy="300" r="55" fill="#6C28D9" fill-opacity="0.3" filter="blur(25px)"/>
    
    <!-- Camera Module on Back (Subtle Silhouette / Preview) -->
    <rect x="115" y="75" width="80" height="85" rx="20" fill="#B3957A" fill-opacity="0.15" stroke="#C5A98F" stroke-width="1.5"/>
    <circle cx="138" cy="98" r="14" fill="#8C7058" stroke="#C5A98F" stroke-width="2"/>
    <circle cx="172" cy="98" r="14" fill="#8C7058" stroke="#C5A98F" stroke-width="2"/>
    <circle cx="138" cy="136" r="14" fill="#8C7058" stroke="#C5A98F" stroke-width="2"/>
    
    <!-- 1Fi Brand Accent on Screen -->
    <text x="200" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#C5A98F" text-anchor="middle" letter-spacing="3">1Fi LAMF BACKED</text>
    <text x="200" y="402" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">iPhone 17 Pro</text>
    <text x="200" y="422" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle">Desert Titanium</text>
  </g>
</svg>
