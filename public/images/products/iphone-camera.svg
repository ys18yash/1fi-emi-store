<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5A98F"/>
      <stop offset="50%" stop-color="#8C7058"/>
      <stop offset="100%" stop-color="#544335"/>
    </linearGradient>
    <filter id="glow">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#087443" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#bg)"/>
  <circle cx="200" cy="200" r="140" fill="#087443" fill-opacity="0.1" filter="blur(40px)"/>
  
  <!-- Camera Island Base -->
  <g filter="url(#glow)">
    <rect x="70" y="70" width="260" height="260" rx="48" fill="#27272A" stroke="url(#metal)" stroke-width="3"/>
    
    <!-- Lens 1 (Top Left) -->
    <circle cx="140" cy="140" r="42" fill="#18181B" stroke="#3F3F46" stroke-width="4"/>
    <circle cx="140" cy="140" r="32" fill="#09090B"/>
    <circle cx="140" cy="140" r="18" fill="#0284C7" fill-opacity="0.6"/>
    <circle cx="132" cy="132" r="6" fill="#FFFFFF" fill-opacity="0.7"/>
    
    <!-- Lens 2 (Top Right) -->
    <circle cx="260" cy="140" r="42" fill="#18181B" stroke="#3F3F46" stroke-width="4"/>
    <circle cx="260" cy="140" r="32" fill="#09090B"/>
    <circle cx="260" cy="140" r="18" fill="#10B981" fill-opacity="0.6"/>
    <circle cx="252" cy="132" r="6" fill="#FFFFFF" fill-opacity="0.7"/>
    
    <!-- Lens 3 (Bottom Left) -->
    <circle cx="140" cy="260" r="42" fill="#18181B" stroke="#3F3F46" stroke-width="4"/>
    <circle cx="140" cy="260" r="32" fill="#09090B"/>
    <circle cx="140" cy="260" r="18" fill="#8B5CF6" fill-opacity="0.6"/>
    <circle cx="132" cy="252" r="6" fill="#FFFFFF" fill-opacity="0.7"/>
    
    <!-- LiDAR & Flash -->
    <circle cx="255" cy="235" r="16" fill="#FACC15" stroke="#713F12" stroke-width="2"/>
    <circle cx="255" cy="285" r="12" fill="#000000" stroke="#3F3F46" stroke-width="1.5"/>
  </g>
  
  <!-- Text Label -->
  <text x="200" y="380" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#10B981" text-anchor="middle" letter-spacing="3">PRO CAMERA SYSTEM</text>
  <text x="200" y="410" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">48MP Fusion + 5x Telephoto</text>
  <text x="200" y="435" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#A1A1AA" text-anchor="middle">Anti-Reflective Optical Coating</text>
  <text x="200" y="470" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#059669" text-anchor="middle">1Fi • INVEST AND UPGRADE</text>
</svg>
