<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="s_cam_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#s_cam_bg)"/>
  
  <!-- Quad Lens Vertical Array -->
  <g transform="translate(100, 70)">
    <!-- Lens 1 (200MP Main) -->
    <circle cx="50" cy="50" r="38" fill="#1F2937" stroke="#4B5563" stroke-width="4"/>
    <circle cx="50" cy="50" r="26" fill="#111827"/>
    <circle cx="50" cy="50" r="14" fill="#3B82F6" fill-opacity="0.6"/>
    <circle cx="44" cy="44" r="5" fill="#FFFFFF" fill-opacity="0.7"/>
    
    <!-- Lens 2 (50MP Ultrawide) -->
    <circle cx="50" cy="145" r="38" fill="#1F2937" stroke="#4B5563" stroke-width="4"/>
    <circle cx="50" cy="145" r="26" fill="#111827"/>
    <circle cx="50" cy="145" r="14" fill="#10B981" fill-opacity="0.6"/>
    
    <!-- Lens 3 (50MP 5x Periscope) -->
    <circle cx="50" cy="240" r="38" fill="#1F2937" stroke="#4B5563" stroke-width="4"/>
    <circle cx="50" cy="240" r="26" fill="#111827"/>
    <rect x="40" y="230" width="20" height="20" rx="4" fill="#6366F1" fill-opacity="0.7"/>
    
    <!-- Right Sub-Sensors -->
    <circle cx="150" cy="50" r="24" fill="#1F2937" stroke="#4B5563" stroke-width="3"/>
    <circle cx="150" cy="50" r="12" fill="#EF4444" fill-opacity="0.6"/>
    <circle cx="150" cy="115" r="14" fill="#F59E0B"/>
    <circle cx="150" cy="175" r="24" fill="#1F2937" stroke="#4B5563" stroke-width="3"/>
  </g>
  
  <text x="200" y="400" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3B82F6" text-anchor="middle" letter-spacing="3">200MP QUAD TELEPHOTO</text>
  <text x="200" y="430" font-family="system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" text-anchor="middle">100x Space Zoom &amp; Nightography</text>
  <text x="200" y="455" font-family="system-ui, sans-serif" font-size="12" font-weight="500" fill="#9CA3AF" text-anchor="middle">AI ISP Image Signal Processing</text>
  <text x="200" y="490" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#10B981" text-anchor="middle">1Fi MUTUAL FUND PLEDGE FINANCING</text>
</svg>
