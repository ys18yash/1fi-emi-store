<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="snap_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="snap_gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="50%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#snap_bg)"/>
  
  <rect x="110" y="110" width="180" height="180" rx="32" fill="#27272A" stroke="url(#snap_gold)" stroke-width="3"/>
  <circle cx="200" cy="200" r="55" fill="#EF4444" fill-opacity="0.15" filter="blur(20px)"/>
  
  <text x="200" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#F59E0B" text-anchor="middle" letter-spacing="3">SNAPDRAGON</text>
  <text x="200" y="210" font-family="system-ui, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">8 ELITE</text>
  <text x="200" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA" text-anchor="middle">FOR GALAXY (3NM)</text>
  
  <!-- AI Features Highlights -->
  <g transform="translate(60, 330)">
    <rect width="280" height="150" rx="16" fill="#18181B" stroke="#3F3F46" stroke-width="1"/>
    
    <text x="20" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FAFAFA">Oryon CPU Architecture</text>
    <text x="260" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="end">4.47 GHz Peak</text>
    
    <line x1="20" y1="55" x2="260" y2="55" stroke="#27272A"/>
    
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FAFAFA">Hexagon NPU</text>
    <text x="260" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#F59E0B" text-anchor="end">45 TOPS AI</text>
    
    <line x1="20" y1="102" x2="260" y2="102" stroke="#27272A"/>
    
    <text x="20" y="132" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#FAFAFA">Galaxy AI Suite</text>
    <text x="260" y="132" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="end">Live Translate</text>
  </g>
</svg>
