<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="mb_chip_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="m4_border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#mb_chip_bg)"/>
  
  <rect x="110" y="110" width="180" height="180" rx="32" fill="#1E293B" stroke="url(#m4_border)" stroke-width="3"/>
  <circle cx="200" cy="200" r="55" fill="#818CF8" fill-opacity="0.15" filter="blur(20px)"/>
  
  <text x="200" y="175" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="3">APPLE SILICON</text>
  <text x="200" y="215" font-family="system-ui, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" text-anchor="middle">M4</text>
  <text x="200" y="240" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle">10-CORE CPU • 10-CORE GPU</text>
  
  <g transform="translate(60, 330)">
    <rect width="280" height="150" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Up to 24 Hours Battery</text>
    <text x="260" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="end">All-Day Pro</text>
    
    <line x1="20" y1="55" x2="260" y2="55" stroke="#334155"/>
    
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">16GB Unified Memory</text>
    <text x="260" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="end">120GB/s Bandwidth</text>
    
    <line x1="20" y1="102" x2="260" y2="102" stroke="#334155"/>
    
    <text x="20" y="132" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">MagSafe 3 &amp; Thunderbolt 4</text>
    <text x="260" y="132" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#FACC15" text-anchor="end">3x Ports</text>
  </g>
</svg>
