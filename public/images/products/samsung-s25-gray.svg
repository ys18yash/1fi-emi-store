<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="bg_sam_gray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3F4F6"/>
      <stop offset="100%" stop-color="#E5E7EB"/>
    </linearGradient>
    <linearGradient id="body_sam_gray" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="50%" stop-color="#6B7280"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <filter id="sam_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#374151" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <rect width="400" height="550" rx="24" fill="url(#bg_sam_gray)"/>
  
  <g filter="url(#sam_shadow)">
    <!-- Boxier Sharp Titanium Corners for S25 Ultra -->
    <rect x="95" y="45" width="210" height="440" rx="16" fill="url(#body_sam_gray)" stroke="#D1D5DB" stroke-width="2"/>
    <rect x="100" y="50" width="200" height="430" rx="12" fill="#111827"/>
    <rect x="103" y="53" width="194" height="424" rx="10" fill="#030712"/>
    
    <!-- Punch-hole Camera -->
    <circle cx="200" cy="68" r="5" fill="#000000" stroke="#1F2937" stroke-width="1"/>
    
    <!-- Samsung Wallpaper Abstract -->
    <polygon points="120,180 280,240 220,380 140,320" fill="#6C28D9" fill-opacity="0.2" filter="blur(30px)"/>
    <polygon points="180,120 270,190 240,290 150,220" fill="#3B82F6" fill-opacity="0.25" filter="blur(25px)"/>
    
    <!-- 1Fi & Samsung Badging -->
    <text x="200" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9CA3AF" text-anchor="middle" letter-spacing="3">1Fi LAMF BACKED</text>
    <text x="200" y="400" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Galaxy S25 Ultra</text>
    <text x="200" y="420" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#9CA3AF" text-anchor="middle">Titanium Gray</text>
  </g>
</svg>
