<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="box_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F4F4F5"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#box_bg)"/>
  
  <text x="200" y="60" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#71717A" text-anchor="middle" letter-spacing="2">WHAT'S IN THE BOX</text>
  
  <!-- iPhone Silhouette -->
  <g transform="translate(70, 90)">
    <rect x="0" y="0" width="110" height="230" rx="22" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="2"/>
    <circle cx="55" cy="115" r="16" fill="#E4E4E7"/>
    <text x="55" y="260" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#18181B" text-anchor="middle">iPhone 17 Pro</text>
    <text x="55" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#71717A" text-anchor="middle">with iOS 19</text>
  </g>
  
  <!-- Braided USB-C Cable -->
  <g transform="translate(220, 90)">
    <rect x="0" y="0" width="110" height="230" rx="22" fill="#F4F4F5" stroke="#D4D4D8" stroke-width="2"/>
    <!-- Cable Loops -->
    <path d="M25 80 Q55 40 85 80 Q55 120 25 160 Q55 200 85 160" stroke="#A1A1AA" stroke-width="5" stroke-linecap="round" fill="none"/>
    <rect x="20" y="70" width="10" height="15" rx="3" fill="#71717A"/>
    <rect x="80" y="155" width="10" height="15" rx="3" fill="#71717A"/>
    
    <text x="55" y="260" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#18181B" text-anchor="middle">USB-C Cable</text>
    <text x="55" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#71717A" text-anchor="middle">Braided (1m)</text>
  </g>
  
  <!-- Environmental / Documentation Note -->
  <g transform="translate(50, 390)">
    <rect width="300" height="90" rx="16" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    <circle cx="35" cy="45" r="16" fill="#087443" fill-opacity="0.1"/>
    <path d="M28 45 L33 50 L42 39" stroke="#087443" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    
    <text x="65" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Official Apple Brand Warranty</text>
    <text x="65" y="56" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">1 Year Official Manufacturer Coverage</text>
    <text x="65" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="600" fill="#087443">1Fi Mutual Fund Collateral Secured</text>
  </g>
</svg>
