<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="bg_pix_por" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="100%" stop-color="#EAE7DF"/>
    </linearGradient>
    <linearGradient id="body_pix_por" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#EAE7DF"/>
      <stop offset="100%" stop-color="#D6D1C4"/>
    </linearGradient>
    <filter id="pix_shadow_por" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#78716C" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#bg_pix_por)"/>
  <g filter="url(#pix_shadow_por)">
    <rect x="95" y="45" width="210" height="440" rx="36" fill="url(#body_pix_por)" stroke="#FFFFFF" stroke-width="2"/>
    <rect x="101" y="51" width="198" height="428" rx="30" fill="#1C1917"/>
    
    <rect x="105" y="80" width="190" height="44" rx="22" fill="#EAE7DF" stroke="#D6D1C4" stroke-width="1.5"/>
    <ellipse cx="145" cy="102" rx="14" ry="14" fill="#000000"/>
    <circle cx="180" cy="102" r="10" fill="#000000"/>
    <circle cx="255" cy="102" r="6" fill="#F59E0B"/>
    
    <circle cx="200" cy="280" r="70" fill="#EAE7DF" fill-opacity="0.4" filter="blur(25px)"/>
    <circle cx="160" cy="330" r="60" fill="#FDE68A" fill-opacity="0.3" filter="blur(30px)"/>
    
    <text x="200" y="380" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#A8A29E" text-anchor="middle" letter-spacing="3">1Fi LAMF BACKED</text>
    <text x="200" y="402" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Pixel 10 Pro</text>
    <text x="200" y="422" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#A8A29E" text-anchor="middle">Porcelain White</text>
  </g>
</svg>
