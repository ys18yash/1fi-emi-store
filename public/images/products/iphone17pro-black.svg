<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="bg_grad_blk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="body_black" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <linearGradient id="screen_glow_blk" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090B"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="phone_shadow_blk" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  
  <rect width="400" height="550" rx="24" fill="url(#bg_grad_blk)"/>
  
  <g filter="url(#phone_shadow_blk)">
    <rect x="95" y="45" width="210" height="440" rx="42" fill="url(#body_black)" stroke="#52525B" stroke-width="1.5"/>
    <rect x="101" y="51" width="198" height="428" rx="36" fill="#000000"/>
    <rect x="105" y="55" width="190" height="420" rx="32" fill="url(#screen_glow_blk)"/>
    
    <rect x="165" y="66" width="70" height="22" rx="11" fill="#18181B"/>
    <circle cx="218" cy="77" r="4" fill="#27272A"/>
    
    <circle cx="200" cy="240" r="70" fill="#6C28D9" fill-opacity="0.25" filter="blur(20px)"/>
    <circle cx="160" cy="300" r="55" fill="#A855F7" fill-opacity="0.2" filter="blur(25px)"/>
    
    <text x="200" y="380" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#A1A1AA" text-anchor="middle" letter-spacing="3">1Fi LAMF BACKED</text>
    <text x="200" y="402" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">iPhone 17 Pro</text>
    <text x="200" y="422" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#71717A" text-anchor="middle">Space Black</text>
  </g>
</svg>
