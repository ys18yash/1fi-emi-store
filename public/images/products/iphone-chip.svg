<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="chip_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="chip_metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#chip_bg)"/>
  
  <!-- Circuit Pattern Background -->
  <g stroke="#334155" stroke-width="1.5" opacity="0.4">
    <path d="M50 100 H150 V200 H100"/>
    <path d="M350 100 H250 V200 H300"/>
    <path d="M50 350 H150 V250"/>
    <path d="M350 350 H250 V250"/>
  </g>
  
  <!-- A19 Pro Chip Core -->
  <rect x="110" y="110" width="180" height="180" rx="32" fill="#1E293B" stroke="url(#chip_metal)" stroke-width="3"/>
  <circle cx="200" cy="200" r="60" fill="#0284C7" fill-opacity="0.15" filter="blur(20px)"/>
  
  <text x="200" y="175" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#94A3B8" text-anchor="middle" letter-spacing="4">APPLE SILICON</text>
  <text x="200" y="215" font-family="system-ui, sans-serif" font-size="28" font-weight="900" fill="#FFFFFF" text-anchor="middle">A19 PRO</text>
  <text x="200" y="240" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#38BDF8" text-anchor="middle" letter-spacing="2">3NM GENERATION</text>
  
  <!-- Specs Highlights -->
  <g transform="translate(60, 330)">
    <rect width="280" height="150" rx="16" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    
    <text x="20" y="38" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">6-Core Pro CPU</text>
    <text x="260" y="38" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="end">20% Faster</text>
    
    <line x1="20" y1="55" x2="260" y2="55" stroke="#334155"/>
    
    <text x="20" y="85" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">6-Core Pro GPU</text>
    <text x="260" y="85" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#10B981" text-anchor="end">Ray Tracing 2.0</text>
    
    <line x1="20" y1="102" x2="260" y2="102" stroke="#334155"/>
    
    <text x="20" y="132" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">16-Core Neural Engine</text>
    <text x="260" y="132" font-family="system-ui, sans-serif" font-size="12" font-weight="600" fill="#38BDF8" text-anchor="end">Apple Intelligence</text>
  </g>
</svg>
