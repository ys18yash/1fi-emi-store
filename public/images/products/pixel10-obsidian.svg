<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="bg_pix_obs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="body_pix_obs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="50%" stop-color="#1F2937"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <filter id="pix_shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#bg_pix_obs)"/>
  <g filter="url(#pix_shadow)">
    <rect x="95" y="45" width="210" height="440" rx="36" fill="url(#body_pix_obs)" stroke="#4B5563" stroke-width="2"/>
    <rect x="101" y="51" width="198" height="428" rx="30" fill="#030712"/>
    
    <!-- Iconic Pixel Camera Visor preview on rear or top screen -->
    <rect x="105" y="80" width="190" height="44" rx="22" fill="#1F2937" stroke="#374151" stroke-width="1.5"/>
    <ellipse cx="145" cy="102" rx="14" ry="14" fill="#000000"/>
    <circle cx="180" cy="102" r="10" fill="#000000"/>
    <circle cx="255" cy="102" r="6" fill="#F59E0B"/>
    
    <circle cx="200" cy="280" r="70" fill="#3B82F6" fill-opacity="0.2" filter="blur(25px)"/>
    <circle cx="160" cy="330" r="60" fill="#10B981" fill-opacity="0.2" filter="blur(30px)"/>
    
    <text x="200" y="380" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#9CA3AF" text-anchor="middle" letter-spacing="3">1Fi LAMF BACKED</text>
    <text x="200" y="402" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Pixel 10 Pro</text>
    <text x="200" y="422" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#6B7280" text-anchor="middle">Obsidian Black</text>
  </g>
</svg>
