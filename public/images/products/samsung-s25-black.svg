<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="bg_sam_blk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B"/>
      <stop offset="100%" stop-color="#09090B"/>
    </linearGradient>
    <linearGradient id="body_sam_blk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3F3F46"/>
      <stop offset="50%" stop-color="#27272A"/>
      <stop offset="100%" stop-color="#18181B"/>
    </linearGradient>
    <filter id="sam_shadow_blk" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="25" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#bg_sam_blk)"/>
  <g filter="url(#sam_shadow_blk)">
    <rect x="95" y="45" width="210" height="440" rx="16" fill="url(#body_sam_blk)" stroke="#52525B" stroke-width="1.5"/>
    <rect x="100" y="50" width="200" height="430" rx="12" fill="#000000"/>
    <circle cx="200" cy="68" r="5" fill="#000000" stroke="#27272A" stroke-width="1"/>
    <circle cx="200" cy="240" r="75" fill="#6C28D9" fill-opacity="0.25" filter="blur(25px)"/>
    <text x="200" y="375" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#71717A" text-anchor="middle" letter-spacing="3">1Fi LAMF BACKED</text>
    <text x="200" y="400" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#FFFFFF" text-anchor="middle">Galaxy S25 Ultra</text>
    <text x="200" y="420" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#A1A1AA" text-anchor="middle">Titanium Black</text>
  </g>
