<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 550" fill="none">
  <defs>
    <linearGradient id="c_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAFA"/>
      <stop offset="100%" stop-color="#E4E4E7"/>
    </linearGradient>
  </defs>
  <rect width="400" height="550" rx="24" fill="url(#c_bg)"/>
  
  <text x="200" y="55" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#71717A" text-anchor="middle" letter-spacing="2">TITANIUM COLOR RANGE</text>
  <text x="200" y="80" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#18181B" text-anchor="middle">iPhone 17 Pro Collection</text>
  
  <!-- Desert Titanium (Left) -->
  <g transform="translate(45, 110)">
    <rect width="90" height="200" rx="20" fill="#C5A98F" stroke="#A88B72" stroke-width="2"/>
    <rect x="8" y="10" width="40" height="42" rx="10" fill="#8C7058" fill-opacity="0.3"/>
    <text x="45" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#18181B" text-anchor="middle">Desert</text>
    <text x="45" y="250" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#71717A" text-anchor="middle">Titanium</text>
  </g>
  
  <!-- Natural Silver (Center) -->
  <g transform="translate(155, 110)">
    <rect width="90" height="200" rx="20" fill="#E3E4E5" stroke="#C4C6C8" stroke-width="2"/>
    <rect x="8" y="10" width="40" height="42" rx="10" fill="#A1A1AA" fill-opacity="0.3"/>
    <text x="45" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#18181B" text-anchor="middle">Natural</text>
    <text x="45" y="250" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#71717A" text-anchor="middle">Silver</text>
  </g>
  
  <!-- Space Black (Right) -->
  <g transform="translate(265, 110)">
    <rect width="90" height="200" rx="20" fill="#2E2C2D" stroke="#18181B" stroke-width="2"/>
    <rect x="8" y="10" width="40" height="42" rx="10" fill="#09090B" fill-opacity="0.5"/>
    <text x="45" y="235" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#18181B" text-anchor="middle">Space</text>
    <text x="45" y="250" font-family="system-ui, sans-serif" font-size="10" font-weight="500" fill="#71717A" text-anchor="middle">Black</text>
  </g>
  
  <!-- Summary Box -->
  <g transform="translate(50, 400)">
    <rect width="300" height="85" rx="16" fill="#FFFFFF" stroke="#E4E4E7" stroke-width="1.5"/>
    <text x="150" y="35" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#18181B" text-anchor="middle">Select Finish &amp; Storage</text>
    <text x="150" y="55" font-family="system-ui, sans-serif" font-size="11" font-weight="500" fill="#71717A" text-anchor="middle">Available in 256GB &amp; 512GB tiers</text>
    <text x="150" y="72" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#087443" text-anchor="middle">0% EMI • ZERO CAPITAL GAINS TAX</text>
  </g>
</svg>
